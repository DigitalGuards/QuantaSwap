name: Frontend CI

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - 'config/protocol-v2*.json'
      - 'scripts/eslint-policy.mjs'
      - 'scripts/lint-ratchet*.mjs'
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches:
      - dev
      - main
    paths:
      - 'config/protocol-v2*.json'
      - 'scripts/eslint-policy.mjs'
      - 'scripts/lint-ratchet*.mjs'
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify lint policy guards
        working-directory: frontend
        run: node --test ../scripts/lint-ratchet.test.mjs

      - name: Verify lint ratchet integration
        working-directory: frontend
        run: node --test ../scripts/lint-ratchet.integration.test.mjs

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Check lint ratchet against base
        working-directory: frontend
        env:
          LINT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: |
          if [ "$LINT_BASE_REF" = "0000000000000000000000000000000000000000" ]; then
            LINT_BASE_REF=HEAD
          fi
          npm run lint:ratchet -- --base-ref "$LINT_BASE_REF"

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build
