name: Frontend CI

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - '**/node_modules/**'
      - 'config/protocol-v2*.json'
      - 'scripts/eslint-policy.mjs'
      - 'scripts/lint-ratchet*.mjs'
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# The weekly run tests dev, where changes land first. Scheduled runs read this
# file from main.
env:
  TEST_REF: ${{ github.event_name == 'schedule' && 'dev' || '' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Test and build frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TEST_REF }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify lint policy guards
        working-directory: frontend
        run: node --test ../scripts/lint-ratchet.test.mjs

      - name: Lint through the ratchet
        working-directory: frontend
        env:
          LINT_BASE_REF: ${{ github.event.pull_request.base.sha || 'HEAD' }}
          LINT_INTEGRATION_REF: origin/dev
        run: npm run lint:ratchet -- --base-ref "$LINT_BASE_REF" --integration-ref "$LINT_INTEGRATION_REF"

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Audit dependencies
        working-directory: frontend
        run: |
          npm audit --omit=dev --audit-level=moderate
          npm audit --audit-level=high
