name: Lint tooling CI

# The ratchet's integration suite tests the lint tooling itself and takes five
# to nine minutes per package, so it runs when that tooling or a package's lint
# inputs change, and weekly. Every pull request still lints through the ratchet
# in its package workflow.
on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - 'scripts/eslint-policy.mjs'
      - 'scripts/lint-ratchet*.mjs'
      - '*/eslint.config.*'
      - '*/tsconfig.eslint.json'
      - '*/package.json'
      - '.github/workflows/lint-tooling-ci.yml'
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# The weekly run tests dev, where changes land first. Scheduled runs read this
# file from main.
env:
  TEST_REF: ${{ github.event_name == 'schedule' && 'dev' || '' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ratchet:
    name: Ratchet integration (${{ matrix.package }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package: [frontend, server, marketmaker]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TEST_REF }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install locked dependencies
        working-directory: ${{ matrix.package }}
        run: npm ci

      - name: Verify lint ratchet integration
        working-directory: ${{ matrix.package }}
        run: node --test ../scripts/lint-ratchet.integration.test.mjs
