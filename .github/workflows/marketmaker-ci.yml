name: Market maker CI

on:
  pull_request:
    paths:
      - 'marketmaker/**'
      - '.github/workflows/marketmaker-ci.yml'
      - '.github/workflows/marketmaker-release.yml'
  push:
    branches:
      - dev
    paths:
      - 'marketmaker/**'
      - '.github/workflows/marketmaker-ci.yml'
      - '.github/workflows/marketmaker-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketmaker-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build container
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: marketmaker/package-lock.json

      - name: Install locked dependencies
        working-directory: marketmaker
        run: npm ci

      - name: Run market maker tests
        working-directory: marketmaker
        run: npm test

      - name: Audit production dependencies
        working-directory: marketmaker
        run: npm audit --omit=dev --audit-level=moderate

      - name: Validate Compose configuration
        working-directory: marketmaker
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Build runtime image
        working-directory: marketmaker
        run: docker build --tag quantaswap-marketmaker:ci .

      - name: Verify hardened runtime and packaged tests
        run: |
          test "$(docker image inspect quantaswap-marketmaker:ci --format '{{.Config.User}}')" = node
          test "$(docker image inspect quantaswap-marketmaker:ci --format '{{json .Config.Healthcheck.Test}}')" = '["CMD","node","dist/healthcheck.js"]'
          docker run --rm \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --entrypoint sh \
            quantaswap-marketmaker:ci \
            -c 'node --test dist/*.test.js'
