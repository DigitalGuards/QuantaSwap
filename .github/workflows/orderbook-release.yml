name: Order book image release

on:
  push:
    tags:
      - 'orderbook-v*.*.*'

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: orderbook-release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/digitalguards/quantaswap-orderbook

jobs:
  publish:
    name: Test, publish, attest, and sign
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate release tag and source branch
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^orderbook-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use orderbook-vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi

          package_version="$(node -p "require('./server/package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "orderbook-v${package_version}" ]]; then
            echo "Release tag does not match server/package.json version ${package_version}" >&2
            exit 1
          fi

          git fetch --no-tags origin dev:refs/remotes/origin/dev
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/dev; then
            echo "Release commit must be reachable from origin/dev" >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install locked dependencies
        working-directory: server
        run: npm ci

      - name: Run release tests
        working-directory: server
        run: npm test

      - name: Audit dependencies
        working-directory: server
        run: npm audit --audit-level=moderate

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive immutable image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=match,pattern=orderbook-v(.*),group=1
            type=sha,prefix=sha-,format=long
          labels: |
            org.opencontainers.image.title=QuantaSwap self-hosted order book
            org.opencontainers.image.description=Testnet-only coordination service for QuantaSwap protocol mode
            org.opencontainers.image.licenses=GPL-3.0

      - name: Build and publish multi-architecture image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=orderbook-release
          cache-to: type=gha,mode=max,scope=orderbook-release

      - name: Attest published image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign published image with GitHub OIDC
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE_NAME}@${DIGEST}"

      - name: Verify architectures and attached build attestations
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          raw_manifest="$(docker buildx imagetools inspect --raw "${IMAGE_NAME}@${DIGEST}")"
          jq -e '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")] | length == 1' <<< "$raw_manifest"
          jq -e '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64")] | length == 1' <<< "$raw_manifest"
          jq -e '[.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest")] | length >= 2' <<< "$raw_manifest"

      - name: Verify keyless image signature
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/orderbook-release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE_NAME}@${DIGEST}"

      - name: Verify GitHub artifact attestation
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify "oci://${IMAGE_NAME}@${DIGEST}" --repo "$GITHUB_REPOSITORY"

      - name: Record immutable release reference
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo '### QuantaSwap order-book image'
            echo
            echo "\`${IMAGE_NAME}@${DIGEST}\`"
            echo
            echo 'Published for linux/amd64 and linux/arm64 with an SBOM, provenance, GitHub artifact attestation, and keyless Sigstore signature.'
          } >> "$GITHUB_STEP_SUMMARY"
